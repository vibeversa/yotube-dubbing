<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube-dub v3 Studio</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .job-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .failed { background-color: #ffebee; }
        .completed { background-color: #e8f5e9; }
        .running { background-color: #e3f2fd; }
        .btn { padding: 5px 10px; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>youtube-dub Studio</h1>

    <div>
        <h3>Create New Job</h3>
        <label>Source Language: <input type="text" id="sourceLang" value="en"></label>
        <label>Target Language: <input type="text" id="targetLang" value="es"></label><br><br>
        <label>YouTube URL: <input type="text" id="sourceUrl" placeholder="https://www.youtube.com/..."></label>
        <label>Local Path: <input type="text" id="localPath" placeholder="/path/to/local/file.mp4"></label><br><br>
        <button class="btn" id="createBtn" onclick="createJob()">Create Job</button>
        <span id="createStatus" style="margin-left: 10px;"></span>
        <div id="createError" style="color: red; margin-top: 5px;"></div>
    </div>

    <hr>

    <h3>Jobs</h3>
    <div id="jobsList">Loading jobs...</div>

    <script src="/static/app.js"></script>
</body>
</html>
