name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        version: "latest"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync
    - name: Run Ruff Check
      run: uv run ruff check .
    - name: Run Ruff Format
      run: uv run ruff format --check .
    - name: Run Mypy
      run: uv run mypy .
    - name: Run Pytest
      run: uv run pytest
